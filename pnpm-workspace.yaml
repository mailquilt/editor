packages:
  - "apps/*"
  - "packages/*"

# `blume check` type-checks the docs site's .astro files only when `astro`
# resolves from apps/docs. It's Blume's dependency, so it's hoisted rather than
# added there, which would give Blume's integrations a second copy of astro.
publicHoistPattern:
  - astro

# Fixes for advisories in the docs site's build. The latest @vercel/routing-utils
# and @tailwindcss/typography pin these exact versions, and nothing else asks for
# them. Each override stops applying once its dependent moves off that version.
overrides:
  path-to-regexp@6.1.0: 6.3.0
  postcss-selector-parser@6.0.10: 6.1.6

# @astrojs/astro2tsx, which `blume check` uses, depends on @emnapi/core 1.11.3
# but not on the @emnapi/runtime that goes with it, so it got whichever one
# was installed. Rolldown's wasm binding brings in 2.0.0-beta.2, and a 1.x core
# with a 2.x runtime crashes. This gives it the runtime that matches its core.
# It stops applying once astro2tsx moves off 0.1.3.
packageExtensions:
  "@astrojs/astro2tsx@0.1.3":
    dependencies:
      "@emnapi/runtime": 1.11.3

patchedDependencies:
  blume@2.2.7: patches/blume@2.2.7.patch
