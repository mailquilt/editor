name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mailquilt/editor exec playwright install --with-deps
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm check-types
      # One suite at a time: run together, the browser suites outgrow the
      # runner's two CPUs, and a suite's server can't start in time.
      - run: pnpm turbo run test --concurrency=1
        env:
          CI: true
