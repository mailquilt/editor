name: CI

on:
  pull_request:
    # Ready for review is when a draft starts being checked.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Read-only. The release job alone adds what it needs to publish.
permissions:
  contents: read

# A newer push to a pull request replaces its run. On main every commit is
# checked to the end, as a rerun of any of them can release, so each one has a
# group of its own. In a shared group, a run waiting behind another is
# cancelled when a newer one joins.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The check and browser jobs run in Playwright's own image, which has every
# browser and the system libraries they need, so they install nothing from
# Ubuntu's package servers. The image's browsers are the ones its own version
# of Playwright runs, so its tag is read from @playwright/test in the lockfile,
# and a Dependabot bump of the package moves the image with it.

# Each action is pinned to a commit, as a tag can be moved to other code.
# Dependabot keeps the pins current, as .github/dependabot.yml sets out.

jobs:
  playwright:
    name: Playwright version
    # A draft is still being worked on, so it isn't checked until it's ready.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false
      # One version for every package, as there is one image.
      - id: version
        run: |
          version=$(grep -oE "^  '@playwright/test@[^']+'" pnpm-lock.yaml | sed "s/.*@//; s/'//" | sort -u)
          if [ -z "$version" ] || [ "$(echo "$version" | wc -l)" -ne 1 ]; then
            echo "::error::Expected one version of @playwright/test in pnpm-lock.yaml, found: ${version:-none}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # A pull request that changes only files no check reads, such as the agent
  # docs, ADRs and changesets, is linted and has its changesets checked, and the
  # rest is skipped. The jobs still run, as their names are required checks, and
  # their steps are what is skipped. A push to main is always checked in full.
  changes:
    name: Files to check
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested: ${{ steps.files.outputs.tested }}
    steps:
      # A pull request's checkout merges it into main, so the merge's first
      # parent is main and the diff between them is the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: files
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Without renames, a file moved into docs/ shows where it came from too.
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
          # README.md and PROJECT.md aren't here, as the install checks read their CDN URLs.
          tested=$(echo "$changed" | grep -vE '^(docs/|\.changeset/[^/]+\.md$|(AGENTS|CLAUDE|CONTRIBUTING|GLOSSARY|SECURITY)\.md$|\.coderabbit\.yaml$)' || true)
          if [ -z "$changed" ] || [ -n "$tested" ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only files no check reads changed, so the build and tests are skipped."
            echo "tested=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Lint, types, unit tests and install checks
    needs: [playwright, changes]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so a pull request can be compared with main.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A pull request that changes a published package adds a changeset, an
      # empty one if it needs no release. A release uses up every changeset,
      # and adds none.
      - if: ${{ github.event_name == 'pull_request' }}
        run: |
          removed=$(git diff --name-only --diff-filter=D origin/main...HEAD -- '.changeset/*.md')
          left=$(git ls-files '.changeset/*.md')
          # A release also raises a package's version, as the version pull request does.
          bumped=$(git diff -U0 origin/main...HEAD -- 'packages/*/package.json' | grep '^+  "version":' || true)
          if [ -n "$removed" ] && [ -z "$left" ] && [ -n "$bumped" ]; then
            echo "A release, so no changeset is needed."
          else
            pnpm changeset status --since=origin/main
          fi
      - run: pnpm lint
      - if: ${{ needs.changes.outputs.tested == 'true' }}
        run: pnpm build
      - if: ${{ needs.changes.outputs.tested == 'true' }}
        run: pnpm check-types
      - if: ${{ needs.changes.outputs.tested == 'true' }}
        run: pnpm turbo run test --filter=@mailquilt/core --filter=@mailquilt/renderer --filter=@repo/install-checks
        env:
          CI: true
      # The editor's code that needs no page. Its other tests run in the browsers below.
      - if: ${{ needs.changes.outputs.tested == 'true' }}
        run: pnpm turbo run test:unit --filter=@mailquilt/editor
      # A failed install check leaves its screenshot, error snapshot and trace.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-check-results
          path: packages/install-checks/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # core and renderer support Node 22 too, so what runs in Node runs there
  # again, in a job of its own so it runs beside the one above. The install is
  # on Node 24, which the repo's own tools need, and the build and tests on 22.
  node-22:
    name: Node 22 tests
    needs: [playwright, changes]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: ${{ needs.changes.outputs.tested == 'true' }}
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - if: ${{ needs.changes.outputs.tested == 'true' }}
        run: pnpm turbo run test --filter=@mailquilt/core --filter=@mailquilt/renderer --filter=@repo/install-checks
        env:
          CI: true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-check-results-node-22
          path: packages/install-checks/test-results/
          if-no-files-found: ignore
          retention-days: 14

  browsers:
    name: Browser tests (${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [playwright, changes]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --user 1001
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # WebKit runs on two workers where the others run on four, as the
      # editor's Playwright config says, so it has twice the shards.
      matrix:
        include:
          - { browser: chromium, shard: 1, shards: 2 }
          - { browser: chromium, shard: 2, shards: 2 }
          - { browser: firefox, shard: 1, shards: 2 }
          - { browser: firefox, shard: 2, shards: 2 }
          - { browser: webkit, shard: 1, shards: 4 }
          - { browser: webkit, shard: 2, shards: 4 }
          - { browser: webkit, shard: 3, shards: 4 }
          - { browser: webkit, shard: 4, shards: 4 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: ${{ needs.changes.outputs.tested == 'true' }}
        run: pnpm install --frozen-lockfile
      # One suite at a time, as each builds and serves its own page first.
      - if: ${{ needs.changes.outputs.tested == 'true' }}
        run: >-
          pnpm turbo run test --concurrency=1 --filter=@mailquilt/editor --filter=@mailquilt/react --filter=docs -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
        env:
          CI: true
      # A failed first try leaves its screenshot, error snapshot and trace, even
      # when a retry passes. A run where nothing failed leaves none.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            packages/*/test-results/
            apps/*/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # A commit on main that every job above passed, and that raised a package's
  # version, publishes the versions npm doesn't have yet. That is the version
  # pull request's merge alone, so each release comes from the commit that
  # versioned it, and a run that overlaps another publishes nothing of its own.
  # A failed publish goes out on a rerun of that commit's run.
  #
  # Two jobs, so the code from dependencies and the build never runs in a job
  # that can ask for the npm token. This one installs, builds and packs, with
  # read-only permissions. Its tarballs are all the next job publishes.
  release-pack:
    name: Pack for npm
    needs: [check, node-22, browsers]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release: ${{ steps.commit.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This commit and the one before it, to see whether it raised a version.
          fetch-depth: 2
          persist-credentials: false
      # The version pull request is squash-merged, so its commit's parent is main
      # as it was. A top-level "version" line added in a package.json is a bump.
      - id: commit
        run: |
          bumped=$(git diff -U0 HEAD^ HEAD -- 'packages/*/package.json' | grep '^+  "version":' || true)
          if [ -n "$bumped" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No package's version changed in this commit, so nothing is published."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.commit.outputs.release == 'true' }}
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No cache, so nothing another run saved goes into what's published.
      - if: ${{ steps.commit.outputs.release == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: ${{ steps.commit.outputs.release == 'true' }}
        run: pnpm install --frozen-lockfile
      # Built here, never taken from a cache.
      - if: ${{ steps.commit.outputs.release == 'true' }}
        run: pnpm turbo run build --force --filter=@mailquilt/*
      # A tarball of each package whose version npm lacks, and a plan with the
      # tarballs' hashes, which the next job publishes from.
      - if: ${{ steps.commit.outputs.release == 'true' }}
        run: pnpm changeset pack --out-dir release-pack
      - if: ${{ steps.commit.outputs.release == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pack
          path: release-pack/
          if-no-files-found: error
          retention-days: 1

  # npm trusts this workflow as the packages' publisher, so no token is kept,
  # and each package gets provenance that names the commit it came from. This
  # job builds nothing and installs only the root's tools, from the lockfile: it publishes the tarballs above.
  release:
    name: Publish to npm
    needs: [release-pack]
    if: ${{ needs.release-pack.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # To push the release's tags.
      contents: write
      # To prove to npm that this workflow is publishing, and sign provenance.
      id-token: write
    steps:
      # The token that can push is kept out of the checkout, and only the last
      # step has it. The checkout is for the packages' names and the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pack
          path: release-pack/
      # Changesets tags each published package with an annotated tag, which
      # records who made it.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # The root's tools alone, as the lockfile pins them with their hashes, and
      # without running any install script. None of the packages' own
      # dependencies are installed, and nothing is resolved afresh.
      - run: pnpm install --frozen-lockfile --filter . --ignore-scripts
      # Provenance is required, so a publish without it fails rather than going
      # ahead unsigned.
      - run: pnpm changeset publish --from-pack-dir release-pack
        env:
          PNPM_CONFIG_PROVENANCE: true
      # Changesets tags each package it published, even when another failed,
      # and a rerun doesn't tag one already on npm, so the tags go up either way.
      - if: ${{ !cancelled() }}
        run: git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
