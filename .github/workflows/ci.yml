name: CI

on:
  pull_request:
    # Ready for review is when a draft starts being checked.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Read-only. The release job alone adds what it needs to publish.
permissions:
  contents: read

# A newer push to a pull request replaces its run. On main every commit is
# checked to the end, as any of them could be released, so each one has a
# group of its own. In a shared group, a run waiting behind another is
# cancelled when a newer one joins.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The check and browser jobs run in Playwright's own image, which has every
# browser and the system libraries they need, so they install nothing from
# Ubuntu's package servers. Its version must match @playwright/test in the
# packages, and the check job fails when it doesn't.

# Each action is pinned to a commit, as a tag can be moved to other code.
# Dependabot keeps the pins current, as .github/dependabot.yml sets out.

jobs:
  check:
    name: Lint, types, unit tests and install checks
    # A draft is still being worked on, so it isn't checked until it's ready.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The whole history, so a pull request can be compared with main.
          fetch-depth: 0
      # The image's browsers are the ones its own version of Playwright runs.
      - name: Check the Playwright image matches @playwright/test
        run: |
          image=$(grep -oE 'mcr\.microsoft\.com/playwright:v[^ -]+' .github/workflows/ci.yml | sed 's/.*:v//' | sort -u)
          package=$(grep -oE "^  '@playwright/test@[^']+'" pnpm-lock.yaml | sed "s/.*@//; s/'//" | sort -u)
          if [ "$image" != "$package" ]; then
            echo "::error::The Playwright image is $image, and @playwright/test is $package."
            exit 1
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A pull request that changes a published package adds a changeset, an
      # empty one if it needs no release. A release uses up every changeset,
      # and adds none.
      - if: ${{ github.event_name == 'pull_request' }}
        run: |
          removed=$(git diff --name-only --diff-filter=D origin/main...HEAD -- '.changeset/*.md')
          left=$(git ls-files '.changeset/*.md')
          if [ -n "$removed" ] && [ -z "$left" ]; then
            echo "A release, so no changeset is needed."
          else
            pnpm changeset status --since=origin/main
          fi
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm check-types
      - run: pnpm turbo run test --filter=@mailquilt/core --filter=@mailquilt/renderer --filter=@repo/install-checks
        env:
          CI: true
      # The editor's code that needs no page. Its other tests run in the browsers below.
      - run: pnpm turbo run test:unit --filter=@mailquilt/editor
      # core and renderer support Node 22 too, so what runs in Node runs there
      # again. Turbo's cache doesn't know the Node version, hence --force.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm turbo run test --force --filter=@mailquilt/core --filter=@mailquilt/renderer --filter=@repo/install-checks
        env:
          CI: true
      # A failed install check leaves its screenshot, error snapshot and trace.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: install-check-results
          path: packages/install-checks/test-results/
          if-no-files-found: ignore
          retention-days: 14

  browsers:
    name: Browser tests (${{ matrix.browser }} ${{ matrix.shard }}/2)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One suite at a time, as each builds and serves its own page first.
      - run: >-
          pnpm turbo run test --concurrency=1 --filter=@mailquilt/editor --filter=@mailquilt/react --filter=docs -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
        env:
          CI: true
      # A failed first try leaves its screenshot, error snapshot and trace, even
      # when a retry passes. A run where nothing failed leaves none.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            packages/*/test-results/
            apps/*/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # A commit on main that both jobs above passed publishes any package whose
  # version isn't on npm yet, so only the version pull request's merge publishes
  # anything. npm trusts this workflow as the packages' publisher, so no token is
  # kept, and each package gets provenance that names the commit it came from.
  release:
    name: Publish to npm
    needs: [check, browsers]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # To push the release's tags.
      contents: write
      # To prove to npm that this workflow is publishing, and sign provenance.
      id-token: write
    steps:
      # The token that can push is kept out of the checkout, so the install and
      # build can't use it. Only the last step has it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      # No cache, so nothing another run saved goes into what's published.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Built here, never taken from a cache.
      - run: pnpm turbo run build --force --filter=@mailquilt/*
      # Changesets tags each published package with an annotated tag, which
      # records who made it.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Provenance is required, so a publish without it fails rather than
      # going ahead unsigned.
      - run: pnpm changeset publish
        env:
          PNPM_CONFIG_PROVENANCE: true
      # Changesets tags each package it published, even when another failed,
      # and a rerun doesn't tag one already on npm, so the tags go up either way.
      - if: ${{ !cancelled() }}
        run: git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
