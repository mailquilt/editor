<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editor 0.4.0 mockups</title>
<style>
.frame {
  --chrome: #ffffff;
  --work: #f4f4f5;
  --dot: #d9d9de;
  --field: #f4f4f5;
  --hover: #ebebee;
  --line: #e7e7ea;
  --line-2: #d4d4d8;
  --text: #18181b;
  --text-2: #52525b;
  --text-3: #6b6b75;
  --select: #3355ff;
  --accent: #3355ff;
  --accent-2: #2440e0;
  --accent-soft: rgb(51 85 255 / 9%);
  --accent-line: rgb(51 85 255 / 35%);
  --on-accent: #ffffff;
  --warn: #c2410c;
  --warn-soft: #fff4ec;
  --ok: #15803d;
  --tag: #18181b;
  --on-tag: #ffffff;
  --sh-bar: 0 0 0 1px rgb(24 24 27 / 6%), 0 1px 2px rgb(24 24 27 / 5%), 0 10px 28px -8px rgb(24 24 27 / 16%);
  --sh-pop: 0 0 0 1px rgb(24 24 27 / 7%), 0 16px 40px -10px rgb(24 24 27 / 26%), 0 4px 10px -4px rgb(24 24 27 / 10%);
  --sh-email: 0 0 0 1px rgb(24 24 27 / 4%), 0 2px 4px rgb(24 24 27 / 4%), 0 24px 48px -24px rgb(24 24 27 / 18%);
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
}
.frame.dark {
  --chrome: #161719;
  --work: #0d0e10;
  --dot: #26272b;
  --field: #212226;
  --hover: #2a2b30;
  --line: #26272b;
  --line-2: #36373d;
  --text: #ededef;
  --text-2: #a8a8b1;
  --text-3: #90909a;
  --select: #4c66f5;
  --accent: #7d94ff;
  --accent-2: #b0bdff;
  --accent-soft: rgb(125 148 255 / 15%);
  --accent-line: rgb(125 148 255 / 45%);
  --on-accent: #0d0e10;
  --warn: #ff9b5e;
  --warn-soft: rgb(255 155 94 / 12%);
  --ok: #4ade80;
  --tag: #ededef;
  --on-tag: #0d0e10;
  --sh-bar: 0 0 0 1px rgb(255 255 255 / 7%), 0 10px 28px -8px rgb(0 0 0 / 60%);
  --sh-pop: 0 0 0 1px rgb(255 255 255 / 8%), 0 16px 40px -10px rgb(0 0 0 / 70%);
  --sh-email: 0 0 0 1px rgb(255 255 255 / 5%), 0 24px 48px -24px rgb(0 0 0 / 70%);
}
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #cfd0d4; display: grid; gap: 24px; justify-content: start; }
.frame { width: 1440px; height: 900px; position: relative; overflow: hidden; background: var(--chrome); color: var(--text); font: 13px/1.4 var(--ui); -webkit-font-smoothing: antialiased; }
.frame.phone { width: 390px; height: 844px; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
svg.i.sm { width: 14px; height: 14px; }
svg.i.lg { width: 18px; height: 18px; }

/* app frame */
.app { display: grid; grid-template-rows: 52px 1fr; height: 100%; }
.app.rail { grid-template-columns: 232px 1fr; }
.app.panel { grid-template-columns: 1fr 352px; }
.app.plain { grid-template-columns: 1fr; }
.top { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 10px 0 14px; border-bottom: 1px solid var(--line); background: var(--chrome); position: relative; z-index: 3; }
.row-flex { display: flex; align-items: center; gap: 2px; }
.doc { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 4px; border-radius: 8px; }
.doc .mk { width: 26px; height: 26px; border-radius: 7px; background: var(--field); display: grid; place-items: center; color: var(--text-2); }
.doc b { font-weight: 600; font-size: 13px; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.doc .st { color: var(--text-3); font-size: 12px; display: flex; align-items: center; gap: 5px; margin-left: 4px; }
.doc .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); opacity: .8; }
.vr { width: 1px; height: 18px; background: var(--line); margin: 0 8px; }
.ib { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; color: var(--text-2); position: relative; }
.ib.on { background: var(--accent-soft); color: var(--accent-2); }
.ib.dim { color: var(--text-3); opacity: .5; }
.ib.h { background: var(--hover); color: var(--text); }
.modes { display: inline-flex; padding: 3px; gap: 2px; background: var(--field); border-radius: 10px; }
.modes span { height: 28px; display: inline-flex; align-items: center; gap: 7px; padding: 0 14px; border-radius: 7px; color: var(--text-2); font-weight: 500; }
.modes span.on { background: var(--chrome); color: var(--text); box-shadow: 0 0 0 1px rgb(0 0 0 / 4%), 0 1px 2px rgb(0 0 0 / 8%); }
.frame.dark .modes span.on { background: var(--hover); box-shadow: none; }
.modes .count { min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--warn-soft); color: var(--warn); font-size: 11px; font-weight: 600; display: inline-grid; place-items: center; }
.right { justify-content: flex-end; gap: 6px; }
.dev { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; border: 1px solid var(--line); }
.dev .ib { width: 28px; height: 26px; border-radius: 6px; }
.btn { height: 32px; display: inline-flex; align-items: center; gap: 7px; padding: 0 13px; border-radius: 8px; font-weight: 550; font-weight: 600; color: var(--text); background: var(--chrome); box-shadow: inset 0 0 0 1px var(--line-2); white-space: nowrap; }
.btn.pri { background: var(--text); color: var(--chrome); box-shadow: none; }
.btn.acc { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 7px; }
.btn.ghost { box-shadow: none; background: transparent; }

/* rows rail */
.rail-p { background: var(--chrome); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.rail-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px 8px 16px; }
.rail-h b { font-size: 12px; font-weight: 600; }
.rail-h b span { color: var(--text-3); font-weight: 500; margin-left: 4px; }
.thumbs { padding: 4px 12px 16px; display: grid; gap: 6px; overflow: hidden; }
.th { display: grid; grid-template-columns: 16px 1fr; gap: 8px; align-items: start; position: relative; }
.th .n { font-size: 11px; color: var(--text-3); text-align: right; padding-top: 4px; font-variant-numeric: tabular-nums; }
.th .card { border-radius: 6px; overflow: hidden; background: #fbf7f1; box-shadow: 0 0 0 1px var(--line); position: relative; }
.th .card .sc { width: 600px; transform-origin: 0 0; pointer-events: none; }
.th.sel .card { box-shadow: 0 0 0 2px var(--accent); }
.th.sel .n { color: var(--accent); font-weight: 600; }
.th .bdg { position: absolute; right: 4px; top: 4px; width: 20px; height: 20px; border-radius: 5px; background: rgb(24 24 27 / 72%); color: #fff; display: grid; place-items: center; }
.th .bdg svg { width: 12px; height: 12px; }
.ins { height: 2px; background: var(--accent); border-radius: 2px; margin: -1px 0 -1px 24px; position: relative; }
.ins::after { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

/* canvas */
.cv { background: var(--work); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 20px 20px; position: relative; overflow: hidden; display: flex; justify-content: center; }
.cv .stage { padding-top: 92px; position: relative; }
.ctx { position: absolute; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; justify-content: center; gap: 2px; padding: 0 12px; background: var(--chrome); border-bottom: 1px solid var(--line); z-index: 6; white-space: nowrap; }
.ctx .vr { margin: 0 6px; height: 20px; }
.chip { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 8px 0 6px; border-radius: 8px; font-weight: 600; }
.chip .ico { width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-2); display: grid; place-items: center; }
.chip .ico svg { width: 13px; height: 13px; }
.chip .path { color: var(--text-3); font-weight: 500; }
.chip .chev { color: var(--text-3); }
.fld { height: 32px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border-radius: 8px; background: var(--field); color: var(--text); min-width: 0; }
.fld .phd { color: var(--text-3); }
.fld .mt { margin-left: -2px; }
.fld.foc { background: var(--chrome); box-shadow: 0 0 0 1px var(--accent), 0 0 0 4px var(--accent-soft); }
.lab { font-size: 11px; color: var(--text-3); font-weight: 500; margin-right: 2px; }
.sw { width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 0 0 1px var(--chrome), 0 0 0 2px var(--line-2); flex: none; }
.sc { color: #2b1d14; font: 16px/1.6 Arial, Helvetica, sans-serif; text-align: left; }
.swb { height: 32px; display: flex; align-items: center; gap: 7px; padding: 0 9px 0 7px; border-radius: 8px; color: var(--text-2); font-weight: 500; }
.seg { display: inline-flex; gap: 1px; padding: 2px; border-radius: 9px; background: var(--field); }
.seg .ib { width: 28px; height: 28px; }
.seg .ib.on { background: var(--chrome); color: var(--text); box-shadow: 0 0 0 1px rgb(0 0 0 / 5%), 0 1px 2px rgb(0 0 0 / 8%); }
.frame.dark .seg .ib.on { background: var(--hover); box-shadow: none; }
.num { height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; border-radius: 8px; background: var(--field); font-variant-numeric: tabular-nums; }
.num .u { color: var(--text-3); font-size: 12px; }
.lay { width: 30px; height: 28px; display: grid; place-items: center; border-radius: 7px; }
.lay i { display: flex; gap: 2px; width: 18px; height: 12px; }
.lay i b { flex: 1; border-radius: 2px; background: var(--text-3); opacity: .55; }
.lay.on { background: var(--chrome); box-shadow: 0 0 0 1px rgb(0 0 0 / 5%), 0 1px 2px rgb(0 0 0 / 8%); }
.lay.on i b { background: var(--accent); opacity: 1; }

/* the email */
.em { width: 600px; background: #fbf7f1; color: #2b1d14; font: 16px/1.6 Arial, Helvetica, sans-serif; box-shadow: var(--sh-email); position: relative; }
.r { position: relative; display: flex; }
.c { flex: 1; position: relative; }
.b { position: relative; }
.e-head { display: flex; align-items: center; justify-content: space-between; padding: 22px 32px; }
.wm { font: 700 13px/1 Arial; letter-spacing: .22em; display: flex; align-items: center; gap: 9px; color: #2b1d14; }
.wm i { width: 18px; height: 18px; border: 2px solid #2b1d14; border-radius: 50%; position: relative; }
.wm i::after { content: ""; position: absolute; left: 6px; top: 1px; border: 3px solid transparent; border-bottom: 7px solid #b5652b; }
.nav { font-size: 13px; color: #5c4a3c; display: flex; gap: 22px; }
.hero img { display: block; width: 600px; height: 300px; object-fit: cover; }
.copy { padding: 36px 44px 6px; }
.h1 { font: 400 36px/1.12 Georgia, "Times New Roman", serif; letter-spacing: -0.01em; margin: 0; color: #2b1d14; }
.p { margin: 0; color: #4a3a2e; }
.mt { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 6px; background: color-mix(in srgb, var(--select) 10%, transparent); color: var(--select); font: 500 13px/1 var(--ui); vertical-align: 1px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--select) 28%, transparent); }
.ebtn { display: inline-block; background: #2b1d14; color: #fbf7f1; font: 700 15px/1 Arial; padding: 15px 28px; border-radius: 999px; }
.prod { padding: 0 32px 28px; }
.prod .c { padding: 12px 12px; }
.prod img { width: 100%; height: 196px; object-fit: cover; border-radius: 6px; display: block; }
.pn { font: 400 19px/1.3 Georgia, serif; margin: 0; color: #2b1d14; }
.pd { font-size: 14px; color: #7a6a5d; margin: 0; }
.pp { font-size: 15px; font-weight: 700; margin: 0; }
.plink { font-size: 14px; font-weight: 700; color: #b5652b; text-decoration: underline; text-underline-offset: 3px; }
.quote { background: #efe6da; padding: 34px 56px; text-align: center; }
.quote q { font: italic 400 22px/1.4 Georgia, serif; color: #2b1d14; quotes: "“" "”"; }
.quote div { font-size: 13px; color: #7a6a5d; margin-top: 10px; }
.foot { padding: 28px 44px 36px; text-align: center; font-size: 12px; color: #7a6a5d; }
.soc { display: flex; gap: 10px; justify-content: center; margin-bottom: 14px; }
.soc i { width: 30px; height: 30px; border-radius: 50%; background: #2b1d14; color: #fbf7f1; display: grid; place-items: center; }
.soc i svg { width: 15px; height: 15px; }




/* selection & hover on the email */
.sel { outline: 2px solid var(--select); outline-offset: -1px; box-shadow: 0 0 0 1px rgb(255 255 255 / 85%); z-index: 3; }
.hov { outline: 1.5px dashed var(--select); outline-offset: -1px; }
.tag { position: absolute; left: -1px; top: -20px; height: 20px; padding: 0 7px; display: flex; align-items: center; gap: 5px; border-radius: 5px 5px 0 0; background: var(--select); color: #fff; font: 600 11px/1 var(--ui); white-space: nowrap; z-index: 4; }
.tag.dark { background: var(--tag); color: var(--on-tag); border-radius: 5px; top: -24px; }
.grip { position: absolute; left: -30px; top: 50%; transform: translateY(-50%); width: 20px; height: 32px; border-radius: 6px; background: var(--chrome); box-shadow: var(--sh-bar); display: grid; place-items: center; color: var(--text-3); z-index: 4; }
.caret { display: inline-block; width: 1.5px; height: 17px; background: #fbf7f1; vertical-align: -3px; margin-left: 1px; }
.textsel { background: rgb(51 85 255 / 22%); border-radius: 2px; }
.dropline { position: absolute; left: -12px; right: -12px; height: 3px; background: var(--accent); border-radius: 2px; z-index: 5; }
.dropline span { position: absolute; left: 50%; transform: translate(-50%, -50%); top: 1px; height: 22px; padding: 0 9px; border-radius: 11px; background: var(--accent); color: var(--on-accent); font: 600 11px/22px var(--ui); white-space: nowrap; }
.dragghost { position: absolute; width: 260px; border-radius: 10px; background: var(--chrome); box-shadow: var(--sh-pop); padding: 8px; z-index: 9; transform: rotate(-2deg); }
.dragghost .mini { height: 96px; border-radius: 6px; overflow: hidden; background: #fbf7f1; position: relative; }
.dragghost .mini .sc { width: 600px; transform: scale(.4); transform-origin: 0 0; }
.dragghost b { display: block; padding: 8px 4px 2px; font-size: 12px; }

/* popovers */
.pop { position: absolute; background: var(--chrome); border-radius: 12px; box-shadow: var(--sh-pop); z-index: 10; padding: 6px; }
.pop .hd { padding: 8px 10px 6px; font-size: 11px; color: var(--text-3); font-weight: 600; display: flex; justify-content: space-between; }
.opt { display: grid; grid-template-columns: 1fr auto; align-items: center; height: 34px; padding: 0 10px; border-radius: 8px; gap: 12px; }
.opt.on { background: var(--accent-soft); }
.opt code { font: 500 12.5px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--text); }
.opt .v { color: var(--text-3); font-size: 12px; }
.opt kbd { font: 500 11px/1 var(--ui); color: var(--text-3); padding: 3px 5px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line-2); }
.search { height: 34px; margin: 2px 2px 6px; border-radius: 8px; background: var(--field); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--text-3); }
.search .typed { color: var(--text); }

/* library */
.lib { position: absolute; left: 0; top: 52px; bottom: 0; width: 340px; background: var(--chrome); border-right: 1px solid var(--line); z-index: 7; padding: 12px 14px; box-shadow: 12px 0 32px -16px rgb(24 24 27 / 18%); }
.lib .search { margin: 0 0 14px; height: 36px; }
.lib h4 { margin: 16px 2px 8px; font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; color: var(--text); }
.lib h4 span { color: var(--text-3); font-weight: 500; }
.bgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.bt { height: 64px; border-radius: 10px; background: var(--field); display: grid; place-items: center; align-content: center; gap: 6px; font-size: 11.5px; font-weight: 500; color: var(--text-2); }
.bt svg { color: var(--text); width: 18px; height: 18px; }
.lgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.lt { height: 44px; border-radius: 9px; background: var(--field); display: flex; gap: 3px; padding: 10px 12px; }
.lt b { flex: 1; border-radius: 3px; background: var(--chrome); box-shadow: 0 0 0 1px var(--line-2); }
.rgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.rt { border-radius: 10px; background: var(--field); padding: 6px; }
.rt .mini { height: 84px; border-radius: 6px; overflow: hidden; background: #fbf7f1; position: relative; }
.rt .mini .sc { width: 600px; transform: scale(.235); transform-origin: 0 0; }
.rt b { display: block; font-size: 12px; font-weight: 500; padding: 7px 3px 2px; }
.rt.lift { opacity: .35; }

/* side panels */
.side { background: var(--chrome); border-left: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; }
.side-h { padding: 16px 18px 14px; border-bottom: 1px solid var(--line); }
.side-h h2 { margin: 0; font-size: 15px; font-weight: 650; font-weight: 600; letter-spacing: -0.01em; }
.side-h p { margin: 3px 0 0; color: var(--text-3); font-size: 12px; }
.sec { padding: 16px 18px 6px; border-bottom: 1px solid var(--line); }
.sec:last-child { border: 0; }
.sec h3 { margin: 0 0 12px; font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.sec h3 span { color: var(--text-3); font-weight: 500; }
.kv { display: grid; grid-template-columns: 1fr auto; align-items: center; min-height: 34px; margin-bottom: 4px; gap: 12px; }
.kv > span:first-child { color: var(--text-2); }
.kv .v { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.kv .hex { font: 12px ui-monospace, "SF Mono", Menlo, monospace; color: var(--text-2); }
.typ { display: grid; grid-template-columns: 1fr auto; align-items: baseline; padding: 8px 10px; border-radius: 8px; margin: 0 -10px 2px; }
.typ.on { background: var(--accent-soft); }
.typ .s { font-family: Georgia, serif; color: var(--text); letter-spacing: -0.01em; }
.typ .m { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.shape { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.shape span { height: 52px; border-radius: 9px; background: #fbf7f1; box-shadow: inset 0 0 0 1px var(--line); display: grid; place-items: center; }
.shape span i { width: 52px; height: 16px; background: #2b1d14; }
.shape span.on { box-shadow: inset 0 0 0 2px var(--accent); }

.tabs3 { display: grid; grid-template-columns: repeat(3, 1fr); padding: 2px; gap: 2px; border-radius: 9px; background: var(--field); margin-bottom: 12px; }
.tabs3 span { height: 28px; display: grid; place-items: center; border-radius: 7px; color: var(--text-2); font-weight: 500; }
.tabs3 span.on { background: var(--chrome); color: var(--text); box-shadow: 0 0 0 1px rgb(0 0 0 / 5%), 0 1px 2px rgb(0 0 0 / 8%); }
.frame.dark .tabs3 span.on { background: var(--hover); }

/* check */
.chk { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.chk:first-of-type { border-top: 0; padding-top: 0; }
.chk .ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; }
.chk .ic.w { background: var(--warn-soft); color: var(--warn); }
.chk .ic.ok { color: var(--ok); }
.chk b { font-weight: 600; display: block; }
.chk p { margin: 2px 0 8px; color: var(--text-2); font-size: 12.5px; }
.chk .where { color: var(--text-3); font-size: 12px; }
.passed { display: grid; gap: 9px; color: var(--text-2); }
.passed div { display: flex; gap: 10px; align-items: center; }
.passed svg { color: var(--ok); }
.pv { display: flex; gap: 36px; align-items: flex-start; padding-top: 72px; }
.inbox { width: 640px; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: var(--sh-email); }
.inbox .ih { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 14px 18px; border-bottom: 1px solid #ececef; font-family: var(--ui); color: #18181b; }
.av { width: 36px; height: 36px; border-radius: 50%; background: #2b1d14; color: #fbf7f1; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.inbox .ih b { font-size: 14px; } .inbox .ih .sub { font-size: 13px; } .inbox .ih .pre { color: #71717a; } .inbox .ih .t { color: #71717a; font-size: 12px; }
.inbox .body { padding: 20px; background: #efe8de; height: 640px; overflow: hidden; }
.inbox .body .em { box-shadow: none; transform: scale(1); }
.ph { width: 300px; height: 640px; border-radius: 44px; background: #0b0b0c; padding: 11px; box-shadow: var(--sh-email); flex: none; }
.ph .scr { width: 278px; height: 618px; border-radius: 34px; overflow: hidden; background: #efe8de; position: relative; }
.ph .scr .bar { height: 44px; background: #fff; display: flex; align-items: flex-end; padding: 0 16px 8px; font: 600 12px var(--ui); color: #2440e0; }
.ph .scr .scaler { width: 375px; transform: scale(.7413); transform-origin: 0 0; }

<script>
const IMG = location.href.replace(/[^/]*$/, "img/");
const P = {
  hero: IMG + "1442512595331-e89e73853f31.jpg",
  beans: IMG + "1447933601403-0c6688de566e.jpg",
  porta: IMG + "1511920170033-f8396924c348.jpg",
  cups: IMG + "1495474472287-4d71bcdd2085.jpg",
  board: IMG + "1497935586351-b67a49e012bf.jpg",
  latte: IMG + "1509042239860-f550ce710b93.jpg",
};
const ic = (id, c = "") => `<svg class="i ${c}"><use href="#${id}"/></svg>`;
const mt = (n) => `<span class="mt">${n}</span>`;

// The email. `s` marks state: s.sel (block id), s.row (row index), s.hov (ids), s.tag, s.edit
function email(s = {}, m = false) {
  const st = (id) => (s.sel === id ? " sel" : "") + ((s.hov || []).includes(id) ? " hov" : "");
  const tg = (id, label) => (s.sel === id ? `<span class="tag">${label}</span>` + (s.grip === false ? "" : `<span class="grip">${ic("grip", "sm")}</span>`) : "") + ((s.htag && s.htag[0] === id) ? `<span class="tag dark">${s.htag[1]}</span>` : "");
  const rs = (n) => (s.row === n ? " sel" : "");
  const rt = (n) => (s.row === n ? `<span class="tag">Row ${n}</span><span class="grip">${ic("grip", "sm")}</span>` : "");
  const h = s.badTag ? "{{frst_name}}" : s.sample ? "Ana" : mt("first_name");
  const btnLabel = s.edit === "btn" ? `Shop the roast<span class="caret"></span>` : "Shop the roast";
  const para = s.edit === "text"
    ? `Hi ${mt("first_name")}, our first harvest of the year just landed from Guji, Ethiopia. Bright, floral and <span class="textsel">gone by May</span>. Your price holds until Friday, {{first_na<span class="caret" style="background:#2b1d14"></span>`
    : `Hi ${h}, our first harvest of the year just landed from Guji, Ethiopia. Bright, floral and gone by May. Your price holds until Friday.`;
  return `<div class="em${m ? " m" : ""}">
  <div class="r${rs(1)}" data-r="1">${rt(1)}<div class="c"><div class="b e-head${st("head")}">${tg("head", "Text")}<span class="wm"><i></i>NORTHBOUND</span><span class="nav"><span>Shop</span><span>Subscriptions</span><span>Journal</span></span></div></div></div>
  <div class="r${rs(2)}" data-r="2">${rt(2)}<div class="c"><div class="b hero${st("hero")}">${tg("hero", "Image")}<img src="${P.hero}" alt=""></div></div></div>
  <div class="r${rs(3)}" data-r="3">${rt(3)}${s.drop === 3 ? `<div class="dropline" style="top:-2px"><span>New Row 3</span></div>` : ""}<div class="c copy">
    <div class="b${st("h1")}" style="margin:0 -12px 14px; padding:4px 12px">${tg("h1", "Heading")}<h1 class="h1">The spring roast is here</h1></div>
    <div class="b${st("p")}" style="margin:0 -12px 22px; padding:4px 12px">${tg("p", "Text")}<p class="p">${para}</p></div>
    <div class="b${st("btn")}" style="margin:0 -12px 30px; padding:6px 12px">${tg("btn", "Button")}<span class="ebtn">${btnLabel}</span></div>
  </div></div>
  ${s.newRow ? `<div class="r sel" style="padding:0 32px 18px"><span class="tag">Row 4</span><div class="c" style="padding:0 12px"><div class="ecol"><span style="width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #e2d6c7;display:grid;place-items:center;color:#2b1d14">${ic("plus", "sm")}</span><span>Add a Block, or drop one here</span></div></div><div class="c" style="padding:0 12px"><div class="ecol hot" style="padding:10px"><div class="pick">${[["text","Text"],["head","Heading"],["img","Image"],["button","Button"],["divider","Divider"],["spacer","Spacer"],["social","Social"],["menu","Menu"],["video","Video"]].map(([k, n], i) => `<span class="${i === 2 ? "f" : ""}">${ic(k, "sm")}${n}</span>`).join("")}</div></div></div></div>` : ""}<div class="r prod${rs(4)}" data-r="4">${rt(4)}${s.drop === 4 ? `<div class="dropline" style="top:-2px"><span>Drop as Row 4</span></div>` : ""}
    <div class="c"><div class="b${st("img1")}${s.img1 === "uploading" ? " uploading" : ""}">${tg("img1", "Image")}<img src="${P.beans}" alt="">${s.img1 === "uploading" ? `<span class="pill"><span class="spin"></span>Uploading…</span>` : ""}</div><div class="b" style="padding-top:14px"><p class="pn">Ethiopia Guji</p><p class="pd">Peach, jasmine, black tea · 250 g</p><p class="pp" style="margin-top:8px">$18 <span class="plink" style="margin-left:10px">Add to bag</span></p></div></div>
    <div class="c"><div class="b${st("img2")}">${tg("img2", "Image")}${s.img2 === "empty" ? `<div class="imgslot">${ic("img")}<b>Drop an image here</b><span>or upload one from your computer</span><span class="mini-btn">Upload</span></div>` : s.img2 === "failed" ? `<div class="imgslot fail">${ic("alert")}<b>beans.heic can’t be used</b><span>Use a PNG, JPEG or GIF image.</span><span class="mini-btn">Choose another</span></div>` : `<img src="${P.porta}" alt="">`}</div><div class="b" style="padding-top:14px"><p class="pn">Colombia Huila</p><p class="pd">Cocoa, red apple, cane sugar · 250 g</p><p class="pp" style="margin-top:8px">$16 <span class="plink" style="margin-left:10px">Add to bag</span></p></div></div>
  </div>
  ${m ? "" : `<div class="r${rs(5)}" data-r="5">${rt(5)}<div class="c quote"><q>The only subscription I've never paused.</q><div>Maya, subscriber since 2022</div></div></div>`}
  <div class="r${rs(6)}" data-r="6">${rt(6)}<div class="c foot"><div class="b${st("social")}" style="display:inline-block; padding:6px 10px; margin-bottom:8px">${tg("social", "Social")}<div class="soc" style="margin:0"><i>${ic("ig")}</i><i>${ic("fb")}</i><i>${ic("globe")}</i></div></div><br>Northbound Roasters · 14 Mill Lane, Portland, OR<br>You get this because you subscribe to our roasts. <u>Unsubscribe</u></div></div>
</div>`;
}

const topBar = (o = {}) => `<div class="top">
  <div class="row-flex">
    ${o.railToggle ? `<span class="ib" style="margin-right:4px">${ic("rows")}</span>` : ""}<div class="doc"><span class="mk">${ic("mail", "sm")}</span><b>${o.fresh ? "Untitled email" : "Spring roast launch"}</b>${o.fresh ? "" : o.unsaved ? `<span class="st bad">Not saved</span>` : `<span class="st">Saved</span>`}</div>
    <span class="vr"></span>
    <span class="ib${o.fresh ? " dim" : ""}">${ic("undo")}</span><span class="ib dim">${ic("redo")}</span>
  </div>
  <div class="modes">
    <span class="${o.mode === "edit" ? "on" : ""}">${ic("pen", "sm")}Edit</span>
    <span class="${o.mode === "style" ? "on" : ""}" style="${o.fresh ? "opacity:.4" : ""}">${ic("palette", "sm")}Style</span>
    <span class="${o.mode === "check" ? "on" : ""}" style="${o.fresh ? "opacity:.4" : ""}">${ic("shield", "sm")}Check${o.fresh || o.clean ? "" : `<span class="count">2</span>`}</span>
  </div>
  <div class="row-flex right">
    ${o.mode === "check" || o.compact ? "" : `<span class="dev"><span class="ib on">${ic("desk", "sm")}</span><span class="ib">${ic("phone", "sm")}</span></span>`}
    <span class="ib">${ic("more")}</span>
    <span class="btn pri${o.fresh ? " off" : ""}">${ic("export", "sm")}Export</span>
  </div>
</div>`;

function rail(sel, o = {}) {
  return `<aside class="rail-p"><div class="rail-h"><b>Rows<span>${o.total || o.count || 6}</span></b><span class="ib">${ic("plus")}</span></div><div class="thumbs" data-sel="${sel}" data-hidden="5" data-ins="${o.ins || ""}" data-new="${o.newAt || ""}" data-total="${o.total || ""}" data-scroll="${o.scroll || ""}"></div>${o.total ? `<span class="sbar" style="top:${52 + 300}px;height:150px"></span>` : ""}</aside>`;
}

const ctxButton = `<div class="ctx">
  <span class="chip"><span class="ico">${ic("button")}</span><span class="path">Row 3 /</span>Button<span class="chev">${ic("chev", "sm")}</span></span><span class="vr"></span>
  <span class="fld foc" style="width:250px">${ic("link", "sm")}<span>northbound.co/spring?u=</span><span class="mt" style="height:20px;font-size:12px">id</span></span><span class="vr"></span>
  <span class="swb"><span class="sw" style="background:#2b1d14"></span>Fill</span>
  <span class="swb"><span class="sw" style="background:#fbf7f1"></span>Text</span><span class="vr"></span>
  <span class="seg"><span class="ib on">${ic("al", "sm")}</span><span class="ib">${ic("ac", "sm")}</span><span class="ib">${ic("ar", "sm")}</span></span><span class="vr"></span>
  <span class="ib">${ic("up")}</span><span class="ib">${ic("down")}</span><span class="ib">${ic("dup")}</span><span class="ib">${ic("trash")}</span><span class="ib">${ic("more")}</span>
</div>`;
const ctxText = `<div class="ctx">
  <span class="chip"><span class="ico">${ic("text")}</span><span class="path">Row 3 /</span>Text<span class="chev">${ic("chev", "sm")}</span></span><span class="vr"></span>
  <span class="num">16<span class="u">px</span>${ic("chev", "sm")}</span>
  <span class="swb"><span class="sw" style="background:#4a3a2e"></span></span><span class="vr"></span>
  <span class="ib">${ic("bold")}</span><span class="ib">${ic("ital")}</span><span class="ib">${ic("under")}</span><span class="vr"></span>
  <span class="ib">${ic("ul")}</span><span class="ib">${ic("ol")}</span><span class="ib">${ic("link")}</span><span class="ib on">${ic("braces")}</span><span class="vr"></span>
  <span class="seg"><span class="ib on">${ic("al", "sm")}</span><span class="ib">${ic("ac", "sm")}</span><span class="ib">${ic("ar", "sm")}</span></span><span class="vr"></span>
  <span class="ib">${ic("more")}</span>
</div>`;
const lay = (w, on) => `<span class="lay${on ? " on" : ""}"><i>${w.map((f) => `<b style="flex:${f}"></b>`).join("")}</i></span>`;
const ctxRow = `<div class="ctx">
  <span class="chip"><span class="ico">${ic("rows")}</span>Row 4<span class="chev">${ic("chev", "sm")}</span></span><span class="vr"></span>
  <span class="lab">Columns</span><span class="seg">${lay([1])}${lay([1, 1], true)}${lay([1, 2])}${lay([2, 1])}${lay([1, 1, 1])}${lay([1, 1, 1, 1])}</span><span class="vr"></span>
  <span class="swb">${ic("pad", "sm")}Padding${ic("chev", "sm")}</span>
  <span class="swb">${ic("phone", "sm")}Stack on phones${ic("chev", "sm")}</span><span class="vr"></span>
  <span class="ib">${ic("up")}</span><span class="ib">${ic("down")}</span><span class="ib">${ic("dup")}</span><span class="ib">${ic("trash")}</span><span class="ib">${ic("more")}</span>
</div>`;

const F = [];
// 1. Edit: Button selected, label being edited
F.push({ id: "1-edit-button", html: () => `<div class="app rail">${topBar({ mode: "edit" })}${rail(3)}<main class="cv">${ctxButton}<div class="stage">${email({ sel: "btn", edit: "btn" })}</div></main></div>` });
F.push({ id: "1-edit-button-dark", dark: true, html: () => F[0].html() });
// 2. Edit: text, Merge Tag picker open
F.push({ id: "2-edit-text", html: () => `<div class="app rail">${topBar({ mode: "edit" })}${rail(3)}<main class="cv">${ctxText}<div class="stage">${email({ sel: "p", edit: "text", grip: true })}
  <div class="pop" style="left:70px; top:636px; width:300px">
    <div class="hd"><span>Merge Tags</span><span>Sample</span></div>
    <div class="opt on"><code>first_name</code><span class="v">Ana</span></div>
    <div class="opt"><code>first_name_or_friend</code><span class="v">Ana</span></div>
    <div class="opt"><code>last_name</code><span class="v">Ruiz</span></div>
    <div class="opt"><code>plan</code><span class="v">Monthly, 2 bags</span></div>
    <div class="opt"><code>points</code><span class="v">1,240</span></div>
  </div></div></main></div>` });
// 3. Add library, dragging a ready-made Row in
F.push({ id: "3-add-drag", html: () => `<div class="app rail">${topBar({ mode: "edit" })}${rail(0, { ins: 3 })}<main class="cv"><div class="stage">${email({ drop: 4 })}</div>
  <div class="dragghost" style="left:470px; top:600px"><div class="mini"><div class="sc" data-clone="4"></div></div><b>Two products</b></div>
  <div style="position:absolute; left:716px; top:668px; color:var(--text); z-index:10">${ic("cursor", "lg")}</div>
  </main>
  <aside class="lib">
    <div class="sheet-h" style="margin:2px 0 12px"><b style="font-size:14px">Add</b><span class="ib">${ic("x")}</span></div>
    <div class="search">${ic("search", "sm")}<span>Search Blocks and Rows</span><span style="margin-left:auto"><kbd style="font:500 11px var(--ui);color:var(--text-3);padding:2px 5px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line-2)">/</kbd></span></div>
    <h4>Blocks</h4>

<script src="surfaces.js"></script>
<script>
// Every frame also in the dark theme.
const BASE = F.filter((f) => !f.id.endsWith("-dark"));
F.length = 0;
for (const f of BASE) { F.push(f); if (!f.noDark) F.push({ ...f, id: f.id + "-dark", dark: true }); }

const root = document.getElementById("frames");
for (const f of F) {
  const el = document.createElement("section");
  el.className = "frame" + (f.dark ? " dark" : "") + (f.phone ? " phone" : "") + (f.id.startsWith("h01") ? " host" : "") + (f.cls ? " " + f.cls : "");
  el.id = f.id;
  if (f.w) { el.style.width = f.w + "px"; el.style.height = f.h + "px"; }
  el.innerHTML = f.html();
  root.append(el);
}
// Clones for thumbnails and previews, from a reference email.
const ref = document.createElement("div"); ref.style.cssText = "position:absolute;left:-9999px;top:0"; ref.innerHTML = email(); document.body.append(ref);
const rowEl = (n) => ref.querySelector(`[data-r="${n}"]`);
document.querySelectorAll("[data-clone]").forEach((sc) => {
  for (const k of sc.dataset.clone.split(",")) {
    if (k === "3x") { const r = rowEl(3).cloneNode(true); r.querySelector(".ebtn").parentElement.remove(); r.querySelector(".p").innerHTML += "<br><br>See you at the roastery,<br>Jonah"; sc.append(r); continue; }
    sc.append(rowEl(k).cloneNode(true));
  }
});
function buildRails() {
  document.querySelectorAll(".thumbs").forEach((t) => {
    const sel = +t.dataset.sel, hid = +t.dataset.hidden, ins = +t.dataset.ins, newAt = +t.dataset.new, total = +t.dataset.total || 6; let k = 0;
    for (let n = 1; n <= total; n++) {
      const m = ((n - 1) % 6) + 1;
      if (ins === n) t.insertAdjacentHTML("beforeend", `<div class="ins"></div>`);
      if (newAt === n) { k++; t.insertAdjacentHTML("beforeend", `<div class="th sel"><span class="n">${k}</span><div class="card" style="height:42px;background:var(--field);display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px"><i style="border:1px dashed var(--line-2);border-radius:3px"></i><i style="border:1px dashed var(--line-2);border-radius:3px"></i></div></div>`); }
      k++;
      const r = rowEl(m); const h = Math.round(r.offsetHeight * (180 / 600));
      const th = document.createElement("div"); th.className = "th" + (sel === n ? " sel" : "");
      th.innerHTML = `<span class="n">${k}</span><div class="card" style="height:${Math.max(h, 18)}px"><div class="sc" style="transform:scale(${180 / 600})"></div>${hid === m ? `<span class="bdg" title="Desktop only">${ic("phoneoff")}</span>` : ""}</div>`;
      th.querySelector(".sc").append(r.cloneNode(true));
      t.append(th);
    }
  });
}
window.addEventListener("load", () => { buildRails(); document.querySelectorAll(".thumbs[data-scroll]").forEach((t) => { t.scrollTop = +t.dataset.scroll || 0; }); window.afterRails && window.afterRails(); document.body.dataset.ready = "1"; });
</script>
